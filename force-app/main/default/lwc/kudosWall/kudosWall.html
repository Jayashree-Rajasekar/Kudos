<template>
  <div class="kudos-header">
    <h2>🎉 Give Kudos</h2>
    <p>Recognize a teammate for great work</p>
  </div>

  <div class="compose-card">
    <lightning-record-picker
      label="Recipient"
      placeholder="Search people..."
      object-api-name="User"
      onchange={handleRecipientChange}
    ></lightning-record-picker>

    <lightning-combobox
      label="Badge Type"
      value={badgeTypeId}
      options={badgeOptions}
      onchange={handleBadgeChange}
      class="slds-m-top_small"
    ></lightning-combobox>

    <lightning-textarea
      label="Message"
      value={message}
      onchange={handleMessageChange}
      class="slds-m-top_small"
    ></lightning-textarea>

    <lightning-button
      label="Give Kudo"
      variant="brand"
      disabled={isSubmitDisabled}
      onclick={handleSubmit}
      class="slds-m-top_small"
    ></lightning-button>
  </div>

  <div class="feed">
    <template for:each={kudos} for:item="kudo">
      <div key={kudo.id} class="feed-item">
        <div class="avatar">{kudo.giverInitials}</div>
        <div class="feed-body">
          <div class="feed-meta">
            <strong>{kudo.giverName}</strong> gave
            <strong>{kudo.recipientName}</strong> a {kudo.badgeName} kudo
            <template if:true={kudo.tierLabel}>
              <span class="tier-pill">{kudo.tierIcon} {kudo.tierLabel}</span>
            </template>
          </div>
          <p class="feed-message">{kudo.message}</p>
        </div>
      </div>
    </template>

    <template if:true={hasNoKudos}>
      <div class="empty-state">No kudos yet — be the first to give one! 🎉</div>
    </template>
  </div>
</template>
